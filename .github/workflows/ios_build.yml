name: Build LivelyMedia iOS App & IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package LivelyMedia iOS
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Run Modular Swift Package Tests
        run: |
          cd ios
          swift test --enable-code-coverage

      - name: Build Modular Release Binaries & Package IPA
        run: |
          cd ios
          swift build -c release
          cd ..
          
          # Create IPA Structure for Sideloadly / AltStore
          mkdir -p build/Payload/LivelyMedia.app
          cp -R LivelyMedia.swiftpm/* build/Payload/LivelyMedia.app/
          cd build
          zip -r LivelyMedia-iOS.ipa Payload
          cd ..

      - name: Upload LivelyMedia IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LivelyMedia-iOS-IPA
          path: build/LivelyMedia-iOS.ipa
          retention-days: 14

      - name: Upload Playgrounds Standalone Bundle (.swiftpm)
        uses: actions/upload-artifact@v4
        with:
          name: LivelyMedia-SwiftPlaygrounds-Bundle
          path: LivelyMedia.swiftpm/
          retention-days: 14
